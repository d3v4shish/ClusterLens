[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clusterlens"
version = "0.4.0a1"
description = "Desktop image clustering workspace with PyQt and cached batched embeddings"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PyQt6>=6.6,<7.0",
  "numpy>=1.26,<2.0",
  "scikit-learn>=1.4,<2.0",
  "Pillow>=10.0,<12.0",
  "torch>=2.2,<2.3",
  "torchvision>=0.17,<0.18",
  "transformers>=4.40,<5.0",
  "sentencepiece>=0.2,<1.0",
  "timm>=1.0,<2.0",
  "facenet-pytorch>=2.6,<3.0",
  "faiss-cpu>=1.8,<2.0",
  "hdbscan>=0.8.33,<1.0",
  "imagehash>=4.3,<5.0",
  "onnx>=1.15,<2.0",
  "onnxruntime>=1.17,<2.0",
  "opencv-python>=4.9,<5.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

